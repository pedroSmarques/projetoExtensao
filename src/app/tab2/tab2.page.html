<ion-content class="ion-padding" [fullscreen]="true">
    @if (produtos.length > 0){
    <ion-card>

        <img [src]="produtos[indiceAtual].image">

        <ion-card-header>

            <ion-card-title>
                {{ produtos[indiceAtual].title }}
            </ion-card-title>

            <ion-card-subtitle>
                ID: {{ produtos[indiceAtual].id }}
            </ion-card-subtitle>

        </ion-card-header>

        <ion-card-content>

            <p>
                {{ produtos[indiceAtual].description }}
            </p>

            <h2 class="preco">
                R$ {{ produtos[indiceAtual].price }}
            </h2>
            <div class="container-botoes">
                <ion-button class="botao1" (click)="voltar()">

                    <ion-icon name="arrow-back-outline"></ion-icon>

                </ion-button>

                <ion-button class="botao2" (click)="passar()">

                    <ion-icon name="arrow-forward-outline"></ion-icon>

                </ion-button>
            </div>
        </ion-card-content>

    </ion-card>
    }
</ion-content>
